name: Build Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - release

env:
  VERSION: 2.2-2
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1

jobs:
  # ------------------------------------------------------------------
  # 第一道闸：源码级静态校验。不依赖任何工具链，秒级完成。
  # 目的是在真正编译之前，先确认补丁确实在源码里，
  # 避免"CI 绿了但编的是旧代码"这类误判。
  # ------------------------------------------------------------------
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify patch presence
        run: |
          set -e
          SRC=SingleVPN.x
          # 只看非注释行：本项目全部是 // 注释，注释里提到坏词不算违规
          CODE=$(grep -v '^[[:space:]]*//' "$SRC")

          cnt() { printf '%s' "$1" | grep -Fc -- "$2" || true; }

          echo "--- 0. 确认推上来的是 2.2-2（根本修复版），不是旧文件 ---"
          for old in gSVPNOriginals SVPNRememberOriginal SVPNRestorePaintedViewsNow \
                     gSVPNPainted kSVPNStyleKey SVPN_DIAG SVPN_DISABLE_ENTRY_MERGE; do
            if printf '%s' "$CODE" | grep -q -- "$old"; then
              echo "✗ 源码里还有旧结构 $old —— 推的不是 2.2-2"; exit 1
            fi
          done
          echo "  ✓ 旧结构已清空"

          echo "--- 1. 启动窗口闸门（2.1-8，实测通过，必须保留）---"
          test "$(cnt "$CODE" 'static volatile int gSVPNReady = 0;')" -eq 1 \
            || { echo "✗ 启动闸门缺失"; exit 1; }
          test "$(cnt "$CODE" 'gSVPNReady = 1;')" -eq 1 \
            || { echo "✗ 闸门置 1 的次数不是 1（提前放行）"; exit 1; }
          grep -q '^#define SVPN_READY_DELAY_MS [0-9]' "$SRC" \
            || { echo "✗ 启动窗口时长缺失"; exit 1; }

          echo "--- 2. 判定统一入口 ---"
          test "$(cnt "$CODE" 'SVPNDecision()')" -ge 6 \
            || { echo "✗ 判定入口没统一走 SVPNDecision"; exit 1; }

          echo "--- 3. VPN 状态只认本轮 data（2.1-9）---"
          test "$(cnt "$CODE" 'STStatusBarDataEntry *vpnNow = data.vpnEntry;')" -eq 2 \
            || { echo "✗ 状态判定未修（应恰好两处）"; exit 1; }
          test "$(cnt "$CODE" 'currentData.vpnEntry.enabled ||')" -eq 0 \
            || { echo "✗ 又退回与上一轮快照做或运算（断开不褪色）"; exit 1; }
          test "$(cnt "$CODE" 'SVPNNoteTransition();')" -eq 2 \
            || { echo "✗ 过渡检测未挂满两个数据层 hook"; exit 1; }

          echo "--- 4. entry 回填已彻底删除 ---"
          test "$(cnt "$SRC" 'dataByReplacingEntry')" -eq 0 \
            || { echo "✗ 还在改写系统 data（塞残缺 entry → 图标整块空白）"; exit 1; }

          echo "--- 5. ★ 2.2-2 核心修复：换色相但保住系统 alpha ---"
          # colorWithAlphaComponent: 是**替换** alpha 不是叠加。
          # 系统给未激活格的 alpha 接近 1，被压到 0.2 后深底≈全黑、浅底≈全白，
          # 两种背景下都「彻底空着」—— 这就是用户报的「不定期图标空白」。
          test "$(cnt "$CODE" 'colorWithAlphaComponent:')" -eq 0 \
            || { echo "✗ 又用 colorWithAlphaComponent: 压 alpha（图标会看不见）"; exit 1; }
          grep -q 'static UIColor \*svpnReplaceKeepingAlpha(UIColor \*original, UIColor \*hue)' "$SRC" \
            || { echo "✗ 保 alpha 的换色函数缺失"; exit 1; }
          test "$(cnt "$CODE" 'svpnReplaceKeepingAlpha(inactiveColor,')" -eq 1 \
            || { echo "✗ setInactiveColor 没走保 alpha 路径"; exit 1; }
          test "$(cnt "$CODE" 'svpnReplaceKeepingAlpha(dimmedAnchor, hue)')" -eq 1 \
            || { echo "✗ imageDimmedTintColor 没走保 alpha 路径"; exit 1; }

          echo "--- 5b. ★★ 结构性不变量：坏色没有产生的机会（2.2-2 根本修复）---"
          # 判「能不能造出看不见的色」这件事，而不是逐行盯哪一处改对了。
          # ① 全工程只有一处造色。
          test "$(cnt "$CODE" 'UIColor colorWithRed:')" -eq 1 \
            || { echo "✗ 出现了第二个造色点（绕开唯一入口 → alpha 又能被随手压掉）"; exit 1; }
          grep -q 'static UIColor \*SVPNColorRGBA(CGFloat r, CGFloat g, CGFloat b, CGFloat a)' "$SRC" \
            || { echo "✗ 唯一造色入口缺失"; exit 1; }
          # ② 事后补救机制不许存在：它的存在本身就说明允许坏色先进来。
          for bad in SVPNHeal SVPNMarkSeen gSVPNSeen; do
            if printf '%s' "$CODE" | grep -q -- "$bad"; then
              echo "✗ 又出现事后扫描修复 $bad —— 治标，坏色应从源头消灭"; exit 1
            fi
          done
          if printf '%s' "$CODE" | grep -q 'DISPATCH_SOURCE_TYPE_TIMER'; then
            echo "✗ 又加回定时轮询（长期和系统抢同一属性）"; exit 1
          fi
          if printf '%s' "$CODE" | grep -Eq 'setNeedsDisplay|setNeedsLayout'; then
            echo "✗ 染色路径里又主动重绘了（会和系统绘制节奏打架）"; exit 1
          fi
          # ③ 色相绝不直接进 UI 槽位：所有染色点必须再包一层保 alpha。
          test "$(cnt "$CODE" 'svpnReplaceKeepingAlpha(')" -ge 5 \
            || { echo "✗ 有染色点绕过保 alpha 包装"; exit 1; }

          echo "--- 6. 还原账本（2.1-10 + 重写简化）---"
          test "$(cnt "$CODE" 'static NSMapTable *gSVPNLedger = nil;')" -eq 1 \
            || { echo "✗ 还原账本缺失"; exit 1; }
          test "$(cnt "$CODE" '[gSVPNLedger removeObjectForKey:view];')" -eq 1 \
            || { echo "✗ 还原后没销账（账本会跨周期复用）"; exit 1; }
          test "$(cnt "$SRC" '@"tint"')" -eq 0 \
            || { echo "✗ tint 槽位没清（setTintColor: 会传播到子视图）"; exit 1; }
          test "$(cnt "$CODE" 'if (prev == 1 && !now) {')" -eq 1 \
            || { echo "✗ 还原触发条件不是 1→0"; exit 1; }

          echo "--- 7. 写入口三条硬约束 ---"
          grep -q 'getRed:&r green:&g blue:&b alpha:&a' "$SRC" \
            || { echo "✗ 缺实色检查（动态色会重解析成错色）"; exit 1; }
          grep -q 'if (a <= 0.001)' "$SRC" \
            || { echo "✗ 缺透明色检查（写透明 = 图标空白）"; exit 1; }
          grep -q '\[cur isEqual:color\]' "$SRC" \
            || { echo "✗ 缺幂等检查"; exit 1; }

          echo "--- 8. 装包红线 ---"
          if grep -Eq 'sbreload|killall|launchctl' devkit/mkdeb.sh; then
            echo "✗ mkdeb.sh 里出现 sbreload / killall / launchctl（会半装）"; exit 1
          fi
          grep -q 'format=tarfile.GNU_FORMAT' devkit/mkdeb.sh \
            || { echo "✗ tar 没指定 GNU_FORMAT（PAX 头会让 dpkg 装不上）"; exit 1; }

          echo "✓ 补丁在位（2.2-2）"

      - name: Source self-check (single source of truth)
        run: |
          set -e
          python3 tools/check_source.py

      - name: Gate self-check (negative injection, zero SKIP)
        run: |
          set -e
          python3 tools/verify_gate218.py

  # ------------------------------------------------------------------
  # 构建：**不安装 Theos**。
  #
  # 历史教训（2026-10-21 用户质问"为什么要Theos 安装，我之前编译了
  # 那么多deb，也没安装这个吧"）：装整套 Theos 只为跑一次 make package，
  # 实测 Setup Theos 要 680 秒（clone 主仓库 + 全部子模块 ~200MB），
  # 而三个架构真正编译合计只要 42 秒。
  #
  # 现在只用：
  #   ① theos 的**单文件** logos.pl 做 %hook 预处理（几百 KB）
  #   ② xcrun clang 直接编 dylib / PreferenceBundle
  #   ③ devkit/mkdeb.sh 自己拼 deb（不依赖 dpkg-deb）
  # 整个 job 从 12 分钟降到 1 分钟量级。
  # ------------------------------------------------------------------
  build:
    needs: verify
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 不用固定 Xcode 版本 15.4：macos-latest 镜像已滚到更新版本，
      # 报 "Could not find Xcode version that satisfied version spec: '15.4'"。
      # 本工程只用 xcrun clang + iPhoneOS SDK，对 Xcode 版本没有特殊要求。
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # logos.pl 已 vendor 进仓库（vendor/logos，270KB，纯 perl 无二进制依赖），
      # 不再依赖运行时从 raw.githubusercontent 下载（该域名在国内网络常不可达）。
      - name: Check vendored Logos
        run: |
          set -e
          test -f vendor/logos/bin/logos.pl \
            || { echo "✗ 缺 vendor/logos/bin/logos.pl"; exit 1; }
          test -x vendor/logos/bin/logos.pl || chmod +x vendor/logos/bin/logos.pl
          perl -e 'print "perl $^V ok\n"'
          perl vendor/logos/bin/logos.pl --help | head -5

      - name: Build (arm64e / roothide)
        run: |
          set -e
          sh devkit/build.sh arm64e iphoneos-arm64e "$VERSION"
          cp .build/out/*.deb .

      - name: Build (arm64 / rootless)
        run: |
          set -e
          sh devkit/build.sh arm64 iphoneos-arm64 "$VERSION"
          cp .build/out/*.deb .

      - name: Report packages
        run: |
          set -e
          ls -la ./*.deb
          for f in ./*.deb; do
            echo "=== $f ==="
            shasum -a 256 "$f"
          done

      - name: Upload Packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ env.VERSION }}
          path: ./*.deb
          if-no-files-found: error
